name: Gemini Monthly Current Affairs Service

on:
  schedule:
    # Run at 04:00 UTC (09:30 IST) on the 1st of every month
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Custom prompt for Gemini API (Leave empty for default monthly current affairs prompt)'
        required: false
        type: string
        default: ''
      target:
        description: 'Target Month/Year (e.g., September 2026). Leave empty for current.'
        required: false
        type: string
        default: ''
      force:
        description: 'Force send email even if already sent previously'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run mode (do not send actual email)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write # Needed to commit state_gemini.json back

jobs:
  gemini-current-affairs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Gemini Current Affairs Service
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          PYTHONUNBUFFERED: "1"

        run: |
          ARGS=""
          if [ -n "${{ inputs.prompt }}" ]; then
            ARGS="$ARGS --prompt \"${{ inputs.prompt }}\""
          fi
          if [ -n "${{ inputs.target }}" ]; then
            ARGS="$ARGS --target \"${{ inputs.target }}\""
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m services.gemini_current_affairs.service $ARGS

      - name: Commit state_gemini.json if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update state_gemini.json for Gemini email service"
          file_pattern: "data/state_gemini.json"
